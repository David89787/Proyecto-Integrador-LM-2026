<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Sevilla FC</title>
  <meta name="description" content="Contacta con nuestra web dedicada al Sevilla FC.">
  <meta name="keywords" content="Sevilla FC, contacto, aficionados, fútbol">
  <meta name="author" content="David Buzón">
</head>
<body>

  <!-- Cabecera -->
  <div>
    <h1>Contacta con nosotros</h1>
    <p>¿Eres sevillista? Escríbenos y comparte tu pasión por el Sevilla FC.</p>
  </div>

  <hr>

  <!-- Formulario de contacto -->
  <div>
    <h2>Formulario de contacto</h2>
    <p>Rellena el siguiente formulario para enviarnos tu consulta.</p>

    <form action="#" method="post">
              <fieldset>
        <legend>Tus datos personales</legend>

        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre"
            placeholder="Escribe tu nombre"
            maxlength="40" required autofocus>
        </p>

        <p>
          <label for="apellidos">Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos"
            placeholder="Escribe tus apellidos"
            minlength="2" maxlength="60" required>
        </p>

        <p>
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo"
            placeholder="ejemplo@gmail.com" required>
        </p>

        <p>
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" name="telefono"
            placeholder="Ejemplo: 600123456">
        </p>

      </fieldset>

    </form>
  </div>

  <hr>

  <!-- Pie de página -->
  <div>
    <p>&copy; 2026 David Buzón</p>
    <p>Proyecto de Lenguajes de Marcas, 1.º DAM.</p>
  </div>

</body>
</html>
